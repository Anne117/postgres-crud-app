# Настройки подключения для локального запуска (вне Docker).
# Допустимы только ключи: host, port, dbname, sslmode, connect_timeout, application_name.
# Логин и пароль здесь НЕ хранятся — их вводит пользователь.

[database]
host = "localhost"
port = 5432
dbname = "appdb"
sslmode = "prefer"
connect_timeout = 10
application_name = "crud-app"
