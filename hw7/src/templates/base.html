<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Склад интернет-магазина{% endblock %}</title>
  <style>
    :root { --bg:#0f1115; --card:#171a21; --line:#2a2f3a; --fg:#e6e9ef; --muted:#9aa3b2; --acc:#5b8cff; --ok:#3fb950; --err:#f85149; }
    * { box-sizing: border-box; }
    body { margin:0; font:15px/1.5 -apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--fg); }
    header { display:flex; align-items:center; justify-content:space-between; padding:14px 20px; border-bottom:1px solid var(--line); }
    header .brand { font-weight:700; }
    header .who { color:var(--muted); font-size:13px; }
    main { max-width:1100px; margin:0 auto; padding:24px 20px 60px; }
    h1 { font-size:24px; margin:0 0 6px; }
    h2 { font-size:18px; margin:24px 0 10px; }
    a { color:var(--acc); }
    .muted { color:var(--muted); }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:14px; margin-top:18px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; }
    .card h3 { margin:0 0 8px; font-size:16px; }
    .card .links a { display:inline-block; margin-right:14px; font-size:14px; }
    table { width:100%; border-collapse:collapse; margin-top:12px; background:var(--card); border-radius:10px; overflow:hidden; }
    th, td { padding:9px 12px; border-bottom:1px solid var(--line); text-align:left; font-size:14px; }
    th { color:var(--muted); font-weight:600; }
    tr:last-child td { border-bottom:none; }
    .toolbar { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-top:12px; }
    .btn { display:inline-block; padding:9px 14px; border-radius:9px; border:1px solid var(--line); background:#20242e; color:var(--fg); text-decoration:none; cursor:pointer; font-size:14px; }
    .btn.primary { background:var(--acc); border-color:var(--acc); color:#fff; }
    input, select { width:100%; padding:9px 11px; border-radius:9px; border:1px solid var(--line); background:#0d0f13; color:var(--fg); font-size:14px; }
    label { display:block; margin:12px 0 5px; color:var(--muted); font-size:13px; }
    .flash { padding:10px 14px; border-radius:9px; margin-bottom:14px; font-size:14px; }
    .flash.ok { background:#12261a; border:1px solid #1f5130; color:#7ee787; }
    .flash.error { background:#2a1215; border:1px solid #5c1f24; color:#ff9b9b; }
    code { background:#00000055; padding:2px 6px; border-radius:6px; }
    .login { max-width:420px; margin:8vh auto; }
  </style>
</head>
<body>
<header>
  <div class="brand">Склад интернет-магазина · ПЗ №7</div>
  {% if session.get('sid') %}
  <div>
    <span class="who">{{ user or '' }}</span>
    <form method="post" action="{{ url_for('logout') }}" style="display:inline">
      <button class="btn" type="submit">Выйти</button>
    </form>
  </div>
  {% endif %}
</header>
<main>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
      <div class="flash {{ cat }}">{{ msg }}</div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
