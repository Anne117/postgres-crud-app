{% extends "base.html" %}
{% block title %}Вход{% endblock %}
{% block content %}
<div class="login card">
  <h1>Вход в приложение</h1>
  <p class="muted">Учётные данные пользователя БД. База: <code>{{ db }}</code></p>
  {% if error %}<div class="flash error">{{ error }}</div>{% endif %}
  <form method="post">
    <label for="user">Логин</label>
    <input id="user" name="user" autocomplete="username" required autofocus value="{{ request.form.get('user','') }}">
    <label for="password">Пароль</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <div style="margin-top:18px">
      <button class="btn primary" type="submit" style="width:100%">Войти</button>
    </div>
  </form>
  <p class="muted" style="margin-top:14px;font-size:13px">
    Неудачные попытки входа записываются в <code>logs/auth.log</code>.
  </p>
</div>
{% endblock %}
