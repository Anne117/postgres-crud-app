# Демонстрационный конфиг PostgreSQL (монтируется в /etc/postgresql/postgresql.conf
# и подключается через `command: postgres -c config_file=...`).
# Локаль кластера ru_RU.UTF-8 задаётся на этапе initdb переменными
# LANG/LC_ALL/LC_CTYPE (см. docker/Dockerfile.db и crud.env).

listen_addresses = '*'
port = 5432
max_connections = 100

log_timezone = 'Europe/Moscow'

# Хэширование паролей на уровне роли/настроек кластера.
password_encryption = 'scram-sha-256'
